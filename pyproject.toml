[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cup-agent"
version = "0.1.0"
description = "Rule-checked AI CUP 2026 Taiwan stock portfolio agent"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-cup-agent = "ai_cup_agent.cli:main"
ai-cup-strategy-document = "ai_cup_agent.strategy_document:main"

[tool.setuptools.packages.find]
where = ["src"]
